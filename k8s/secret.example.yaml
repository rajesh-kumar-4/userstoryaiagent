apiVersion: v1
kind: Secret
metadata:
  name: userstoryai-secrets
  labels:
    app.kubernetes.io/part-of: userstoryai
type: Opaque
stringData:
  API_KEYS: '{"replace-with-a-long-random-admin-key":"ADMIN"}'
